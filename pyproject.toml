[project]
name = "paperchat"
version = "0.1.0"
description = "Private paper reader with persistent, paper-scoped conversations."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.116",
    "httpx>=0.28",
    "pydantic-settings>=2.7",
    "uvicorn[standard]>=0.34",
]

[project.scripts]
paperchat-api = "paperchat.main:run"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["server/paperchat"]

[tool.pytest.ini_options]
testpaths = ["server/tests"]
pythonpath = ["server"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
ignore = ["BLE001"]
